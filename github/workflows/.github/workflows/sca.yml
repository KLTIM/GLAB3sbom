name: SCA Security Gate

on:
  push:
    branches: [main, vulnerable-demo]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  sca:
    name: SBOM, Trivy и Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inventory embedded dependencies
        run: python3 scripts/dependency_analyzer.py

      - name: Generate CycloneDX SBOM
        run: |
          if [ "${GITHUB_REF_NAME}" = "vulnerable-demo" ]; then
            python3 scripts/generate_sbom.py --output sbom/sbom-combined.cdx.json
          else
            python3 scripts/generate_sbom.py --fixed --output sbom/sbom-combined.cdx.json
          fi
          python3 scripts/validate_sbom.py sbom/sbom-combined.cdx.json

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          version: v0.76.2
          cache: true

      - name: Scan SBOM with Trivy
        run: |
          mkdir -p reports
          trivy sbom --scanners vuln --severity CRITICAL,HIGH,MEDIUM,LOW \
            --exit-code 0 --timeout 10m0s --format json \
            --output reports/sca-trivy.json sbom/sbom-combined.cdx.json

      - name: Apply Security Gate
        id: gate
        run: |
          set +e
          python3 scripts/sca_gate.py reports/sca-trivy.json --summary reports/sca-gate-summary.json
          code=$?
          set -e
          {
            echo "### SCA Security Gate"
            echo ""
            echo "- Ветка: \`${GITHUB_REF_NAME}\`"
            echo "- SBOM: CycloneDX 1.6"
            echo "- Сканер: Trivy v0.76.2"
            echo ""
            echo '```json'
            cat reports/sca-gate-summary.json
            echo ""
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${code}"

      - name: Upload SBOM and SCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-evidence-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            sbom/sbom-combined.cdx.json
            reports/dependency-analysis.json
            reports/sca-trivy.json
            reports/sca-gate-summary.json
          retention-days: 30
